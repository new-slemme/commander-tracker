version: '3.8'

services:
  commander-tracker:
    build: .
    container_name: commander-tracker
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - CCAUTO_BASE_URL=http://cc-auto:4242
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env or environment}
      - APP_CHANNEL=stable
      - PEER_CHANNEL_URL=${STABLE_PEER_URL:-http://localhost:5001}
    volumes:
      - ./data:/data
      - ./apk:/app/apk
    networks:
      - npm_default

  commander-tracker-test:
    build:
      context: ${TEST_BUILD_CONTEXT:-.}
      dockerfile: Dockerfile
    container_name: commander-tracker-test
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - CCAUTO_BASE_URL=http://cc-auto:4242
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env or environment}
      - APP_CHANNEL=test
      - PEER_CHANNEL_URL=${TEST_PEER_URL:-http://localhost:5000}
    volumes:
      - ./data:/data
      - ./apk:/app/apk
    networks:
      - npm_default

networks:
  npm_default:
    external: true
