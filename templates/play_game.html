{% extends "base.html" %}
{% block content %}
    <link href="{{ url_for('static', filename='css/play_game.css') }}" rel="stylesheet">

<div class="container pg-wrap">

  <div class="pg-hero">
    <div class="d-flex flex-column flex-lg-row align-items-start align-items-lg-center justify-content-between gap-3">
      <div>
        <h1 class="card-head-title">Play Game</h1>
        <div class="pg-sub">
          Pick players, then choose a deck for each. Duplicate players are blocked automatically.
        </div>
      </div>

      <div class="pg-actions">
        <div class="count-picker title-font">
          <label for="playerCountSelect">Players:</label>
          <select id="playerCountSelect" class="form-select form-select-sm" aria-label="Player count">
            {% for count in range(2,7) %}
            <option value="{{ count }}" {% if count == 2 %}selected{% endif %}>{{ count }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
    </div>
  </div>

  <form method="post" action="/start_game" id="gameForm">
    <div class="player-grid players-2" id="playerContainer">
      {% for i in range(1,7) %}
      <div class="player-panel {% if i > 2 %}hidden{% endif %}" data-slot="{{ i }}">
        <div class="player-tile" data-slot="{{ i }}">
          <div class="player-tile-body">
            <div class="life-position-indicator" id="positionHint{{ i }}" aria-live="polite">
              <span class="pos-icon" aria-hidden="true">↖</span>
              <span class="pos-text">Life layout</span>
            </div>
            <label class="form-label mb-1 title-font">Select Player:</label>
            <select name="player{{ i }}" id="player{{ i }}" class="form-select mb-3">
              <option value="">- None -</option>
              {% for p in players %}
                <option value="{{ p.id }}">{{ p.name }}</option>
              {% endfor %}
            </select>

            <label class="form-label mb-1 title-font">Select Deck:</label>
            <select name="deck{{ i }}" id="deck{{ i }}" class="form-select" disabled>
              <option>Select player first</option>
            </select>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>

    <div class="starting-card">
      <label class="form-label mb-1">Starting Position</label>
      <select name="starting_player" id="startingPlayer" class="form-select d-none" required>
        <option value="" disabled selected>Select starting player</option>
      </select>
      <div id="startingPlayerPills" class="starting-player-pills"></div>
      <div class="hint mt-2">Choose who takes turn 1.</div>
    </div>

    <div class="sticky-actions">
      <div class="hint">
        Tip: You can leave unused slots as “- None -”.
      </div>

      <button type="submit" class="btn btn-success btn-lg" id="startGameBtn">
        Start Game
      </button>
    </div>
  </form>
</div>

<script>
  const decksData = {{ decks_json | safe }};
  let playerCount = 2;

  function isActiveSlot(i) {
    return i <= playerCount;
  }

  function getSelectedPlayerIds() {
    const ids = new Set();
    for (let i = 1; i <= 6; i++) {
      if (!isActiveSlot(i)) continue;
      const sel = document.getElementById('player' + i);
      if (!sel) continue;
      const v = sel.value;
      if (v) ids.add(v);
    }
    return ids;
  }

  function updatePlayerOptionDisabling() {
    for (let i = 1; i <= 6; i++) {
      if (!isActiveSlot(i)) continue;
      const sel = document.getElementById('player' + i);
      if (!sel) continue;

      const myValue = sel.value;
      const chosen = getSelectedPlayerIds();

      for (const opt of sel.options) {
        if (!opt.value) { opt.disabled = false; continue; } // "- None -"
        opt.disabled = (chosen.has(opt.value) && opt.value !== myValue);
      }
    }
  }

  function selectedPlayersMap() {
    const map = new Map();
    for (let i = 1; i <= 6; i++) {
      if (!isActiveSlot(i)) continue;
      const sel = document.getElementById("player" + i);
      if (!sel) continue;
      const pid = sel.value;
      if (!pid) continue;

      const name = sel.options[sel.selectedIndex]?.text || pid;
      map.set(pid, name);
    }
    return map;
  }

  function refreshStartingPlayerOptions() {
    const startSel = document.getElementById("startingPlayer");
    const pills = document.getElementById("startingPlayerPills");
    if (!startSel || !pills) return;

    const prev = startSel.value;
    const players = selectedPlayersMap();

    startSel.innerHTML = `<option value="" disabled ${prev ? "" : "selected"}>Select starting player</option>`;
    for (const [pid, name] of players.entries()) {
      startSel.add(new Option(name, pid));
    }

    if (prev && players.has(prev)) {
      startSel.value = prev;
    } else {
      startSel.value = "";
    }

    pills.innerHTML = "";

    if (!players.size) {
      const empty = document.createElement("div");
      empty.className = "start-pill-empty";
      empty.textContent = "Select players above to choose a starting position.";
      pills.appendChild(empty);
      return;
    }

    for (const [pid, name] of players.entries()) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = `start-pill${startSel.value === pid ? " active" : ""}`;
      btn.textContent = name;
      btn.addEventListener("click", () => {
        startSel.value = pid;
        pills.querySelectorAll('.start-pill').forEach(x => x.classList.remove('active'));
        btn.classList.add("active");
      });
      pills.appendChild(btn);
    }
  }

  function setPlayerCardBackground(i) {
    const playerSel = document.getElementById("player" + i);
    const deckSel = document.getElementById("deck" + i);
    if (!playerSel || !deckSel) return;

    if (!isActiveSlot(i)) return;

    const tile = deckSel.closest(".player-panel")?.querySelector(".player-tile");
    if (!tile) return;

    if (!isActiveSlot(i)) return;

    const pid = playerSel.value;
    const did = deckSel.value;

    let art = null;
    if (pid && did) {
      const list = decksData[String(pid)] || [];
      const match = list.find(x => String(x.id) === String(did));
      art = match?.art || null;
    }

    if (art) {
      tile.classList.add("has-bg");
      tile.style.setProperty("--deck-bg", `url('${art}')`);
    } else {
      tile.classList.remove("has-bg");
      tile.style.removeProperty("--deck-bg");
    }
  }

  function getLifeLayoutPosition(count, slot) {
    const byCount = {
      2: {
        1: { icon: "⬅️", label: "Left" },
        2: { icon: "➡️", label: "Right" },
      },
      3: {
        1: { icon: "↖️", label: "Top Left" },
        2: { icon: "↙️", label: "Bottom Left" },
        3: { icon: "➡️", label: "Right" },
      },
      4: {
        1: { icon: "↖️", label: "Top Left" },
        2: { icon: "↗️", label: "Top Right" },
        3: { icon: "↙️", label: "Bottom Left" },
        4: { icon: "↘️", label: "Bottom Right" },
      },
      5: {
        1: { icon: "↖️", label: "Top Left" },
        2: { icon: "⬆️", label: "Top Middle" },
        3: { icon: "↗️", label: "Top Right" },
        4: { icon: "↙️", label: "Bottom Left" },
        5: { icon: "↘️", label: "Bottom Middle" },
      },
      6: {
        1: { icon: "↖️", label: "Top Left" },
        2: { icon: "⬆️", label: "Top Middle" },
        3: { icon: "↗️", label: "Top Right" },
        4: { icon: "↙️", label: "Bottom Left" },
        5: { icon: "⬇️", label: "Bottom Middle" },
        6: { icon: "↘️", label: "Bottom Right" },
      },
    };

    return byCount[count]?.[slot] || { icon: "•", label: "Position" };
  }

  function refreshLifeLayoutHints() {
    for (let i = 1; i <= 6; i++) {
      const hint = document.getElementById("positionHint" + i);
      if (!hint) continue;

      const isActive = isActiveSlot(i);
      hint.style.display = isActive ? "inline-flex" : "none";
      if (!isActive) continue;

      const pos = getLifeLayoutPosition(playerCount, i);
      const iconEl = hint.querySelector(".pos-icon");
      const textEl = hint.querySelector(".pos-text");
      if (iconEl) iconEl.textContent = pos.icon;
      if (textEl) textEl.textContent = `Life layout: ${pos.label}`;
    }
  }

  function refreshDeckSelect(i) {
    const playerSel = document.getElementById('player' + i);
    const deckSel = document.getElementById('deck' + i);
    if (!playerSel || !deckSel) return;

    const pid = playerSel.value;

    deckSel.innerHTML = '<option value="">Select deck</option>';
    deckSel.disabled = true;

    if (pid && decksData[String(pid)]) {
      decksData[String(pid)].forEach(d => {
        deckSel.add(new Option(d.name, d.id));
      });
      deckSel.disabled = false;
    } else if (!pid) {
      deckSel.innerHTML = '<option>Select player first</option>';
      deckSel.disabled = true;
    }

    // clear bg when player changes (no deck selected yet)
    setPlayerCardBackground(i);
  }

  function setupPlayerListeners(i) {
    const playerSel = document.getElementById('player' + i);
    if (!playerSel) return;

    playerSel.addEventListener('change', function() {
      refreshDeckSelect(i);
      refreshStartingPlayerOptions();
      updatePlayerOptionDisabling();
    });
  }

  function setupDeckListeners(i) {
    const deckSel = document.getElementById("deck" + i);
    if (!deckSel) return;

    deckSel.addEventListener("change", function() {
      setPlayerCardBackground(i);
    });
  }

  function applyPlayerCount(count) {
    playerCount = count;

    const container = document.getElementById('playerContainer');
    container.className = `player-grid players-${playerCount}`;

    for (let i = 1; i <= 6; i++) {
      const panel = document.querySelector(`.player-panel[data-slot="${i}"]`);
      const playerSel = document.getElementById('player' + i);
      const deckSel = document.getElementById('deck' + i);
      const tile = panel?.querySelector('.player-tile');

      if (!panel || !playerSel || !deckSel) continue;

      const isActive = i <= playerCount;
      panel.classList.toggle('hidden', !isActive);

      if (!isActive) {
        playerSel.value = '';
        deckSel.innerHTML = '<option>Select player first</option>';
        deckSel.disabled = true;
        if (tile) {
          tile.classList.remove('has-bg');
          tile.style.removeProperty('--deck-bg');
        }
      } else {
        refreshDeckSelect(i);
      }
    }

    refreshStartingPlayerOptions();
    updatePlayerOptionDisabling();
    refreshLifeLayoutHints();
  }

  for (let i = 1; i <= 6; i++) {
    setupPlayerListeners(i);
    setupDeckListeners(i);
    refreshDeckSelect(i);
  }
  applyPlayerCount(2);
  refreshStartingPlayerOptions();
  updatePlayerOptionDisabling();
  refreshLifeLayoutHints();

  document.getElementById('playerCountSelect').addEventListener('change', function() {
    applyPlayerCount(Number(this.value));
  });

  // ---- Fullscreen + Landscape on Start Game (user gesture) ----
  async function requestLifeCounterImmersive() {
    try {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        await document.documentElement.requestFullscreen();
      }
    } catch (e) {}

    try {
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock("landscape");
      }
    } catch (e) {}
  }

  document.getElementById("gameForm").addEventListener("submit", async (e) => {
    if (!e.target.checkValidity()) return;

    e.preventDefault();

    const btn = document.getElementById("startGameBtn");
    if (btn) btn.disabled = true;

    await requestLifeCounterImmersive();

    e.target.submit();
  });
</script>

{% endblock %}
