{% extends "base.html" %}
{% block content %}
<h1>Play Game</h1>
<form method="post" action="/start_game" id="gameForm">
    <div class="row" id="playerContainer">
        {% for i in range(1,5) %}  <!-- Base 4 players -->
        <div class="col-md-6 mb-3 player-card">
            <div class="card">
                <div class="card-body">
                    <h5>Player {{ i }}</h5>
                    <select name="player{{ i }}" id="player{{ i }}" class="form-select mb-2">
                        <option value="">- None -</option>
                        {% for p in players %}
                            <option value="{{ p.id }}">{{ p.name }}</option>
                        {% endfor %}
                    </select>
                    <select name="deck{{ i }}" id="deck{{ i }}" class="form-select mb-2" disabled>
                        <option>Select player first</option>
                    </select>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="mb-3">
      <label class="form-label">Starting Player</label>
      <select name="starting_player" id="startingPlayer" class="form-select" required>
        <option value="" disabled selected>Select starting player</option>
      </select>
      <div class="form-text">Only selected players appear here.</div>
    </div>

    <button type="button" id="addPlayer" class="btn btn-secondary mb-3">Add Player (up to 6)</button>
    <button type="submit" class="btn btn-success btn-lg" id="startGameBtn">Start Game</button>
</form>

<script>
    const decksData = {{ decks_json | safe }};
    let playerCount = 4;  // Start with 4

    function setupPlayerListeners(i) {
        const playerSel = document.getElementById('player' + i);
        const deckSel = document.getElementById('deck' + i);

        playerSel.addEventListener('change', function() {
            const pid = this.value;

            // Prevent duplicate players in UI
            for (let j = 1; j <= playerCount; j++) {
              if (j === i) continue;
              const other = document.getElementById("player" + j);
              if (other && other.value === pid && pid !== "") {
                alert("This player is already selected.");
                this.value = "";
                refreshStartingPlayerOptions();
                return;
              }
            }

            deckSel.innerHTML = '<option value="">Select deck</option>';
            deckSel.disabled = true;
            refreshStartingPlayerOptions();

            if (pid && decksData[pid]) {
                decksData[pid].forEach(d => {
                    const opt = new Option(d.name, d.id);
                    deckSel.add(opt);
                });
                deckSel.disabled = false;
            }
        });
    }

    function selectedPlayersMap() {
      const map = new Map();
      for (let i = 1; i <= playerCount; i++) {
        const sel = document.getElementById("player" + i);
        if (!sel) continue;
        const pid = sel.value;
        if (!pid) continue;

        const name = sel.options[sel.selectedIndex]?.text || pid;
        map.set(pid, name);
      }
      return map;
    }

    function refreshStartingPlayerOptions() {
      const startSel = document.getElementById("startingPlayer");
      if (!startSel) return;

      const prev = startSel.value;
      const players = selectedPlayersMap();

      startSel.innerHTML = `<option value="" disabled ${prev ? "" : "selected"}>Select starting player</option>`;
      for (const [pid, name] of players.entries()) {
        const opt = new Option(name, pid);
        startSel.add(opt);
      }

      if (prev && players.has(prev)) {
        startSel.value = prev;
      }
    }

    // Setup initial 4
    for (let i = 1; i <= 4; i++) setupPlayerListeners(i);

    // Add player button
    document.getElementById('addPlayer').addEventListener('click', function() {
        if (playerCount >= 6) return;

        playerCount++;
        const container = document.getElementById('playerContainer');
        const newCard = container.querySelector('.player-card').cloneNode(true);

        newCard.querySelector('h5').textContent = 'Player ' + playerCount;

        const pSel = newCard.querySelector('select:first-of-type');
        pSel.id = 'player' + playerCount;
        pSel.name = 'player' + playerCount;
        pSel.value = '';

        const dSel = newCard.querySelector('select:last-of-type');
        dSel.id = 'deck' + playerCount;
        dSel.name = 'deck' + playerCount;
        dSel.innerHTML = '<option>Select player first</option>';
        dSel.disabled = true;

        container.appendChild(newCard);
        setupPlayerListeners(playerCount);
        refreshStartingPlayerOptions();

        if (playerCount === 6) this.disabled = true;
    });

    // ---- Fullscreen + Landscape on Start Game (user gesture) ----
    async function requestLifeCounterImmersive() {
      // Fullscreen
      try {
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
      } catch (e) {}

      // Landscape lock (mostly works on Android Chrome when fullscreen)
      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock("landscape");
        }
      } catch (e) {}
    }

    document.getElementById("gameForm").addEventListener("submit", async (e) => {
      // Let browser validate required fields first:
      if (!e.target.checkValidity()) return;

      // Intercept, go immersive, then submit
      e.preventDefault();

      // Optional: disable button to avoid double submits
      const btn = document.getElementById("startGameBtn");
      if (btn) btn.disabled = true;

      await requestLifeCounterImmersive();

      // Now submit for real
      e.target.submit();
    });
</script>
{% endblock %}
