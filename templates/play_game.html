{% extends "base.html" %}
{% block content %}

<style>
  /* --- Play Game page polish --- */
  .pg-wrap { padding-top: 10px; padding-bottom: 26px; }

  .pg-hero {
    background: linear-gradient(135deg, rgba(22,45,61,0.55), rgba(23,26,38,0.92));
    border: 1px solid rgba(143,153,197,0.25);
    border-radius: 22px;
    box-shadow: 0 0 28px rgba(0,0,0,0.55);
    padding: 18px 18px;
    margin-bottom: 16px;
  }

  .pg-sub {
    margin-top: 6px;
    color: var(--font-base-trans);
    font-size: 0.95rem;
  }

  .pg-actions {
    display:flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
  }

  .count-picker {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
  }

  .count-picker .form-select {
    min-height: auto;
    width: 90px;
    border-radius: 12px;
    text-align: center;
    font-weight: 800;
  }

  .pg-btn {
    border-radius: 14px;
    padding: 10px 16px;
    font-weight: 800;
    box-shadow: 0 0 14px rgba(143,153,197,0.18);
  }

  .pg-btn-secondary {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(143,153,197,0.25);
    color: #fff;
  }
  .pg-btn-secondary:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(143,153,197,0.35);
    color: #fff;
  }

  .player-grid {
    display:grid;
    min-height: 360px;
    margin-top: 12px;
    border-radius: 22px;
    border: 1px solid rgba(143,153,197,0.28);
    background: linear-gradient(135deg, rgba(18,22,35,0.92), rgba(11,14,24,0.82));
    box-shadow: 0 0 24px rgba(0,0,0,0.35);
    overflow: hidden;
  }

  .player-grid.players-2 {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr;
  }

  .player-grid.players-3 {
    grid-template-columns: 49% 51%;
    grid-template-rows: 1fr 1fr;
    grid-template-areas:
      "p1 p3"
      "p2 p3";
  }

  .player-grid.players-4 {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
  }

  .player-grid.players-5,
  .player-grid.players-6 {
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr;
  }

  .player-grid.players-3 .player-panel[data-slot="1"] { grid-area: p1; }
  .player-grid.players-3 .player-panel[data-slot="2"] { grid-area: p2; }
  .player-grid.players-3 .player-panel[data-slot="3"] { grid-area: p3; }

  .player-panel.hidden { display: none; }

  @media (max-width: 992px) {
    .player-grid,
    .player-grid.players-2,
    .player-grid.players-4 {
      min-height: auto;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(2, minmax(210px, 1fr));
    }

    .player-grid.players-2 {
      grid-template-rows: minmax(210px, 1fr);
    }

    .player-grid.players-3 {
      min-height: auto;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(2, minmax(210px, 1fr));
      grid-template-areas:
        "p1 p3"
        "p2 p3";
    }

    .player-grid.players-5,
    .player-grid.players-6 {
      min-height: auto;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(3, minmax(210px, 1fr));
      grid-template-areas: none;
    }

    .player-grid {
      gap: 10px;
      padding: 10px;
      overflow: visible;
    }

    .player-panel {
      min-height: 210px;
      border: 1px solid rgba(170,181,235,0.35) !important;
      border-radius: 16px;
    }

    .player-tile-body {
      justify-content: flex-start;
      padding: 14px 12px;
    }

    .player-tile .form-label {
      font-size: 0.74rem;
      margin-bottom: 0.25rem !important;
    }

    .player-tile .form-select {
      min-height: 40px;
      font-size: 0.9rem;
      border-radius: 12px;
    }
  }

  .player-tile{
    position: relative;
    height: 100%;
    background: linear-gradient(145deg, rgba(20,25,40,0.38), rgba(13,16,28,0.12));
    overflow: hidden;
  }

  .player-panel {
    min-height: 260px;
    border-right: none;
    border-bottom: none;
  }

  .player-grid.players-2 .player-panel[data-slot="1"],
  .player-grid.players-3 .player-panel[data-slot="1"],
  .player-grid.players-3 .player-panel[data-slot="2"],
  .player-grid.players-4 .player-panel[data-slot="1"],
  .player-grid.players-4 .player-panel[data-slot="3"],
  .player-grid.players-5 .player-panel[data-slot="1"],
  .player-grid.players-5 .player-panel[data-slot="2"],
  .player-grid.players-5 .player-panel[data-slot="4"],
  .player-grid.players-6 .player-panel[data-slot="1"],
  .player-grid.players-6 .player-panel[data-slot="2"],
  .player-grid.players-6 .player-panel[data-slot="4"],
  .player-grid.players-6 .player-panel[data-slot="5"] {
    border-right: 1px solid rgba(170,181,235,0.34);
  }

  .player-grid.players-4 .player-panel[data-slot="1"],
  .player-grid.players-4 .player-panel[data-slot="2"],
  .player-grid.players-3 .player-panel[data-slot="1"],
  .player-grid.players-3 .player-panel[data-slot="2"],
  .player-grid.players-5 .player-panel[data-slot="1"],
  .player-grid.players-5 .player-panel[data-slot="2"],
  .player-grid.players-5 .player-panel[data-slot="3"],
  .player-grid.players-6 .player-panel[data-slot="1"],
  .player-grid.players-6 .player-panel[data-slot="2"],
  .player-grid.players-6 .player-panel[data-slot="3"] {
    border-bottom: 1px solid rgba(170,181,235,0.34);
  }

  @media (max-width: 576px) {
    .player-grid,
    .player-grid.players-2,
    .player-grid.players-3,
    .player-grid.players-4,
    .player-grid.players-5,
    .player-grid.players-6 {
      grid-template-columns: 1fr;
      grid-template-rows: repeat(auto-fill, minmax(190px, 1fr));
      grid-template-areas: none;
    }

    .player-grid .player-panel {
      grid-area: auto !important;
    }
  }

  /* background image layer (reads CSS var) */
  .player-tile::before{
    content:"";
    position:absolute;
    inset:0;
    background-image: var(--deck-bg);
    background-size: cover;
    background-position: center top;
    background-repeat:no-repeat;
    opacity: 0;
    transition: opacity .25s ease;
    z-index:0;
  }

  /* readability overlay (off until bg is active) */
  .player-tile::after{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(
      135deg,
      rgba(10,12,18,0.88),
      rgba(10,12,18,0.55),
      rgba(10,12,18,0.92)
    );
    opacity: 0;
    transition: opacity .25s ease;
    z-index:1;
    pointer-events:none;
  }

  .player-tile.has-bg::before{ opacity: 1; }
  .player-tile.has-bg::after{ opacity: 1; }

  /* ensure card contents render above overlay */
  .player-tile > * { position: relative; z-index: 2; }

  .player-tile-header{ display:none; }

  .player-label {
    font-weight: 900;
    letter-spacing: 0.08em;
    color:#fff;
    opacity: 0.9;
  }

  .player-tile-body {
    padding: 22px 20px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
  }

  .player-tile .form-label {
    font-size: 0.82rem;
    letter-spacing: 0.06em;
    color: rgba(191,202,247,0.92);
  }

  .form-select, .form-control {
    border-radius: 14px;
    min-height: 46px;
    background-color: var(--darker-trans);
    border-color: rgba(143,153,197,0.65);
  }

  .form-select:focus, .form-control:focus {
    border-color: rgba(181,194,255,0.95);
    box-shadow: 0 0 0 0.2rem rgba(123,149,255,0.22);
  }

  .hint {
    color: var(--font-base-trans);
    font-size: 0.9rem;
  }

  .starting-card {
    margin-top: 14px;
    border-radius: 20px;
    border: 1px solid rgba(143,153,197,0.3);
    background: linear-gradient(135deg, rgba(23,26,38,0.85), rgba(14,18,30,0.75));
    padding: 14px 16px;
    box-shadow: 0 0 24px rgba(0,0,0,0.35);
  }

  .starting-player-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 8px;
  }

  .start-pill {
    border: 1px solid rgba(170,181,235,0.35);
    background: rgba(255,255,255,0.04);
    color: #dbe2ff;
    border-radius: 999px;
    padding: 8px 14px;
    font-weight: 700;
    transition: all .2s ease;
  }

  .start-pill:hover {
    border-color: rgba(170,181,235,0.7);
    background: rgba(170,181,235,0.14);
    transform: translateY(-1px);
  }

  .start-pill.active {
    background: linear-gradient(135deg, rgba(90,114,219,0.9), rgba(130,150,240,0.9));
    color: #fff;
    border-color: rgba(211,220,255,0.95);
    box-shadow: 0 0 20px rgba(124,146,245,0.35);
  }

  .start-pill-empty {
    color: var(--font-base-trans);
    font-size: 0.95rem;
    padding: 4px 2px;
  }

  .sticky-actions {
    margin-top: 16px;
    display:flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
  }

  /* On mobile: keep “Start Game” easy to reach */
  @media (max-width: 430px) {
    .pg-hero { padding: 16px; }
    .sticky-actions {
      position: sticky;
      bottom: 10px;
      padding: 10px;
      border-radius: 18px;
      background: rgba(23,26,38,0.75);
      border: 1px solid rgba(143,153,197,0.18);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      z-index: 5;
    }
    .sticky-actions .btn {
      flex: 1 1 auto;
      min-height: 48px;
      border-radius: 16px;
      font-weight: 900;
    }
  }

  /* Disabled options readability */
  option:disabled { color: rgba(143,153,197,0.45); }
</style>

<div class="container pg-wrap">

  <div class="pg-hero">
    <div class="d-flex flex-column flex-lg-row align-items-start align-items-lg-center justify-content-between gap-3">
      <div>
        <h1 class="card-head-title">Play Game</h1>
        <div class="pg-sub">
          Pick players, then choose a deck for each. Duplicate players are blocked automatically.
        </div>
      </div>

      <div class="pg-actions">
        <div class="count-picker title-font">
          <label for="playerCountSelect">Players:</label>
          <select id="playerCountSelect" class="form-select form-select-sm" aria-label="Player count">
            {% for count in range(2,7) %}
            <option value="{{ count }}" {% if count == 2 %}selected{% endif %}>{{ count }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
    </div>
  </div>

  <form method="post" action="/start_game" id="gameForm">
    <div class="player-grid players-2" id="playerContainer">
      {% for i in range(1,7) %}
      <div class="player-panel {% if i > 2 %}hidden{% endif %}" data-slot="{{ i }}">
        <div class="player-tile" data-slot="{{ i }}">
          <div class="player-tile-body">
            <label class="form-label mb-1 title-font">Select Player:</label>
            <select name="player{{ i }}" id="player{{ i }}" class="form-select mb-3">
              <option value="">- None -</option>
              {% for p in players %}
                <option value="{{ p.id }}">{{ p.name }}</option>
              {% endfor %}
            </select>

            <label class="form-label mb-1 title-font">Select Deck:</label>
            <select name="deck{{ i }}" id="deck{{ i }}" class="form-select" disabled>
              <option>Select player first</option>
            </select>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>

    <div class="starting-card">
      <label class="form-label mb-1">Starting Position</label>
      <select name="starting_player" id="startingPlayer" class="form-select d-none" required>
        <option value="" disabled selected>Select starting player</option>
      </select>
      <div id="startingPlayerPills" class="starting-player-pills"></div>
      <div class="hint mt-2">Choose who takes turn 1.</div>
    </div>

    <div class="sticky-actions">
      <div class="hint">
        Tip: You can leave unused slots as “- None -”.
      </div>

      <button type="submit" class="btn btn-success btn-lg" id="startGameBtn">
        Start Game
      </button>
    </div>
  </form>
</div>

<script>
  const decksData = {{ decks_json | safe }};
  let playerCount = 2;

  function isActiveSlot(i) {
    return i <= playerCount;
  }

  function getSelectedPlayerIds() {
    const ids = new Set();
    for (let i = 1; i <= 6; i++) {
      if (!isActiveSlot(i)) continue;
      const sel = document.getElementById('player' + i);
      if (!sel) continue;
      const v = sel.value;
      if (v) ids.add(v);
    }
    return ids;
  }

  function updatePlayerOptionDisabling() {
    for (let i = 1; i <= 6; i++) {
      if (!isActiveSlot(i)) continue;
      const sel = document.getElementById('player' + i);
      if (!sel) continue;

      const myValue = sel.value;
      const chosen = getSelectedPlayerIds();

      for (const opt of sel.options) {
        if (!opt.value) { opt.disabled = false; continue; } // "- None -"
        opt.disabled = (chosen.has(opt.value) && opt.value !== myValue);
      }
    }
  }

  function selectedPlayersMap() {
    const map = new Map();
    for (let i = 1; i <= 6; i++) {
      if (!isActiveSlot(i)) continue;
      const sel = document.getElementById("player" + i);
      if (!sel) continue;
      const pid = sel.value;
      if (!pid) continue;

      const name = sel.options[sel.selectedIndex]?.text || pid;
      map.set(pid, name);
    }
    return map;
  }

  function refreshStartingPlayerOptions() {
    const startSel = document.getElementById("startingPlayer");
    const pills = document.getElementById("startingPlayerPills");
    if (!startSel || !pills) return;

    const prev = startSel.value;
    const players = selectedPlayersMap();

    startSel.innerHTML = `<option value="" disabled ${prev ? "" : "selected"}>Select starting player</option>`;
    for (const [pid, name] of players.entries()) {
      startSel.add(new Option(name, pid));
    }

    if (prev && players.has(prev)) {
      startSel.value = prev;
    } else {
      startSel.value = "";
    }

    pills.innerHTML = "";

    if (!players.size) {
      const empty = document.createElement("div");
      empty.className = "start-pill-empty";
      empty.textContent = "Select players above to choose a starting position.";
      pills.appendChild(empty);
      return;
    }

    for (const [pid, name] of players.entries()) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = `start-pill${startSel.value === pid ? " active" : ""}`;
      btn.textContent = name;
      btn.addEventListener("click", () => {
        startSel.value = pid;
        pills.querySelectorAll('.start-pill').forEach(x => x.classList.remove('active'));
        btn.classList.add("active");
      });
      pills.appendChild(btn);
    }
  }

  function setPlayerCardBackground(i) {
    const playerSel = document.getElementById("player" + i);
    const deckSel = document.getElementById("deck" + i);
    if (!playerSel || !deckSel) return;

    if (!isActiveSlot(i)) return;

    const tile = deckSel.closest(".player-panel")?.querySelector(".player-tile");
    if (!tile) return;

    if (!isActiveSlot(i)) return;

    const pid = playerSel.value;
    const did = deckSel.value;

    let art = null;
    if (pid && did) {
      const list = decksData[String(pid)] || [];
      const match = list.find(x => String(x.id) === String(did));
      art = match?.art || null;
    }

    if (art) {
      tile.classList.add("has-bg");
      tile.style.setProperty("--deck-bg", `url('${art}')`);
    } else {
      tile.classList.remove("has-bg");
      tile.style.removeProperty("--deck-bg");
    }
  }

  function refreshDeckSelect(i) {
    const playerSel = document.getElementById('player' + i);
    const deckSel = document.getElementById('deck' + i);
    if (!playerSel || !deckSel) return;

    const pid = playerSel.value;

    deckSel.innerHTML = '<option value="">Select deck</option>';
    deckSel.disabled = true;

    if (pid && decksData[String(pid)]) {
      decksData[String(pid)].forEach(d => {
        deckSel.add(new Option(d.name, d.id));
      });
      deckSel.disabled = false;
    } else if (!pid) {
      deckSel.innerHTML = '<option>Select player first</option>';
      deckSel.disabled = true;
    }

    // clear bg when player changes (no deck selected yet)
    setPlayerCardBackground(i);
  }

  function setupPlayerListeners(i) {
    const playerSel = document.getElementById('player' + i);
    if (!playerSel) return;

    playerSel.addEventListener('change', function() {
      refreshDeckSelect(i);
      refreshStartingPlayerOptions();
      updatePlayerOptionDisabling();
    });
  }

  function setupDeckListeners(i) {
    const deckSel = document.getElementById("deck" + i);
    if (!deckSel) return;

    deckSel.addEventListener("change", function() {
      setPlayerCardBackground(i);
    });
  }

  function applyPlayerCount(count) {
    playerCount = count;

    const container = document.getElementById('playerContainer');
    container.className = `player-grid players-${playerCount}`;

    for (let i = 1; i <= 6; i++) {
      const panel = document.querySelector(`.player-panel[data-slot="${i}"]`);
      const playerSel = document.getElementById('player' + i);
      const deckSel = document.getElementById('deck' + i);
      const tile = panel?.querySelector('.player-tile');

      if (!panel || !playerSel || !deckSel) continue;

      const isActive = i <= playerCount;
      panel.classList.toggle('hidden', !isActive);

      if (!isActive) {
        playerSel.value = '';
        deckSel.innerHTML = '<option>Select player first</option>';
        deckSel.disabled = true;
        if (tile) {
          tile.classList.remove('has-bg');
          tile.style.removeProperty('--deck-bg');
        }
      } else {
        refreshDeckSelect(i);
      }
    }

    refreshStartingPlayerOptions();
    updatePlayerOptionDisabling();
  }

  for (let i = 1; i <= 6; i++) {
    setupPlayerListeners(i);
    setupDeckListeners(i);
    refreshDeckSelect(i);
  }
  applyPlayerCount(2);
  refreshStartingPlayerOptions();
  updatePlayerOptionDisabling();

  document.getElementById('playerCountSelect').addEventListener('change', function() {
    applyPlayerCount(Number(this.value));
  });

  // ---- Fullscreen + Landscape on Start Game (user gesture) ----
  async function requestLifeCounterImmersive() {
    try {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        await document.documentElement.requestFullscreen();
      }
    } catch (e) {}

    try {
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock("landscape");
      }
    } catch (e) {}
  }

  document.getElementById("gameForm").addEventListener("submit", async (e) => {
    if (!e.target.checkValidity()) return;

    e.preventDefault();

    const btn = document.getElementById("startGameBtn");
    if (btn) btn.disabled = true;

    await requestLifeCounterImmersive();

    e.target.submit();
  });
</script>

{% endblock %}
