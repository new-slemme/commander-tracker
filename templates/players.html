{% extends "base.html" %}
{% block content %}
<h1>Players</h1>
<form method="post" action="/add_player" class="mb-3">
    <div class="input-group w-50">
        <input type="text" name="name" class="form-control" placeholder="New player name" required>
        <button class="btn btn-primary">Add Player</button>
    </div>
</form>
<ul class="list-group">
    {% for p in players %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <span>{{ p.name }}</span>
        
          {% if player_can_delete.get(p.id) %}
            <form method="post" action="{{ url_for('delete_player', player_id=p.id) }}"
                  onsubmit="return confirm('Delete player {{ p.name }}? This cannot be undone.');"
                  style="display:inline;">
              <button type="submit" class="btn btn-sm btn-danger">Delete</button>
            </form>
          {% else %}
            <button type="button" class="btn btn-sm btn-danger" disabled
                    title="Can't delete: player appears in recorded games or has decks used in games">
              Delete
            </button>
          {% endif %}
        </li>
    {% endfor %}
</ul>
{% endblock %}
