<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commander Tracker</title>
  <link href="/static/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{
      --darkest:#10121a;
    }

    html,body{
      height:100%;
      margin:0;
      overflow:hidden;
      background:var(--darkest);
      font-family:Arial,sans-serif;
      touch-action:manipulation;
    }

    /* -------- Fullscreen overlay (mobile requirement) -------- */
    .fs-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.85);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:9999;
    }

    /* -------- Grid -------- */
    .life-grid{
      position:fixed;
      inset:0;
      display:grid;
    }

    .life-card{
      position:relative;
      overflow:hidden;
      background:#000;
    }

    .life-card::before{
      content:"";
      position:absolute;
      inset:0;
      background-image:var(--bg-layer);
      background-size:cover;
      background-position:center;
      transform:var(--bg-rotate);
    }

    .card-inner{
      position:relative;
      z-index:2;
    }

    .life-display{
      font-size:18vh;
      font-weight:900;
      color:#fff;
      text-shadow:0 0 10px rgba(0,0,0,.9);
      user-select:none;
    }

    .life-card.active-turn{
      outline:4px solid rgba(255,255,255,.35);
    }

    .pass-btn{
      position:absolute;
      bottom:20px;
      right:20px;
    }

    .turn-pill{
      position:fixed;
      top:14px;
      left:50%;
      transform:translateX(-50%);
      padding:8px 14px;
      background:rgba(0,0,0,.55);
      border-radius:999px;
      color:#fff;
      font-weight:800;
      z-index:100;
    }

    .center-menu-btn{
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      z-index:200;
    }

    /* Grid layouts */
    .players-2{grid-template-rows:1fr 1fr;}
    .players-3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;}
    .players-4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;}
    .players-5{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;}
    .players-6{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;}

  </style>
</head>

<body>

<!-- Fullscreen overlay -->
<div id="fsOverlay" class="fs-overlay">
  <button class="btn btn-primary btn-lg" id="fsBtn">
    Tap for Fullscreen
  </button>
</div>

{% set n = participants|length %}

<div class="turn-pill" id="turnPill">Turn 1</div>

<div class="life-grid players-{{ n }}">

  {% for p in participants %}
  {% set is_top =
      (n == 2 and loop.index0 == 0) or
      (n == 3 and loop.index0 < 2) or
      (n == 4 and loop.index0 < 2) or
      (n == 5 and loop.index0 < 3) or
      (n == 6 and loop.index0 < 3)
  %}

  <div
    class="life-card {% if is_top %}top-card{% endif %}"
    data-player="{{ p.player_id }}"
    style="
      {% if p.commander_art %}
        --bg-layer:
          linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.85)),
          url('{{ p.commander_art }}');
      {% else %}
        --bg-layer:
          linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.85));
      {% endif %}
      {% if is_top %}--bg-rotate:rotate(180deg);{% endif %}
    "
  >

    <div class="card-inner h-100 w-100" style="{% if is_top %}transform:rotate(180deg);{% endif %}">

      <div class="position-absolute top-50 start-50 translate-middle life-display"
           id="life-{{ p.player_id }}">40</div>

      <button class="btn btn-sm btn-light pass-btn"
              id="pass-{{ p.player_id }}"
              style="display:none;">
        Pass →
      </button>

    </div>
  </div>

  {% endfor %}

</div>

<button class="center-menu-btn btn btn-light rounded-circle p-3 shadow"
        data-bs-toggle="modal"
        data-bs-target="#menuModal">
  ☰
</button>

<!-- Modal -->
<div class="modal fade" id="menuModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark text-light">
      <div class="modal-body text-center">

        <button class="btn btn-primary w-100 mb-3" id="toggleFsBtn">
          Toggle Fullscreen
        </button>

        <form method="post" action="/end_game">
          <select name="winner" class="form-select mb-3" required>
            <option value="" disabled selected>Select Winner</option>
            {% for p in participants %}
            <option value="{{ p.player_id }}">{{ p.player_name }}</option>
            {% endfor %}
          </select>
          <button type="submit" class="btn btn-success w-100 mb-3">
            End & Record
          </button>
        </form>

        <form method="post" action="/cancel_game">
          <button class="btn btn-outline-danger w-100">
            Quit without Saving
          </button>
        </form>

      </div>
    </div>
  </div>
</div>

<script>
/* ---------- FULLSCREEN ---------- */

async function goFullscreen(){
  try{
    if(!document.fullscreenElement){
      await document.documentElement.requestFullscreen();
    }
  }catch(e){}
  document.getElementById("fsOverlay").style.display="none";
}

document.getElementById("fsBtn").addEventListener("click", goFullscreen);

document.getElementById("toggleFsBtn").addEventListener("click", async ()=>{
  if(document.fullscreenElement){
    await document.exitFullscreen();
  }else{
    await goFullscreen();
  }
});

/* ---------- TURN SYSTEM ---------- */

let turn = 1;
let active = null;
let passed = new Set();

const cards = [...document.querySelectorAll(".life-card")];

function updateTurnPill(){
  document.getElementById("turnPill").textContent = "Turn " + turn;
}

function setActive(id){
  active = id;
  cards.forEach(c=>{
    c.classList.toggle("active-turn", c.dataset.player === id);
    const btn = c.querySelector(".pass-btn");
    if(btn) btn.style.display = (c.dataset.player === id) ? "block" : "none";
  });
}

function nextPlayer(){
  const ids = cards.map(c=>c.dataset.player);
  let idx = ids.indexOf(active);
  passed.add(active);

  if(passed.size === ids.length){
    turn++;
    passed.clear();
    updateTurnPill();
  }

  setActive(ids[(idx+1)%ids.length]);
}

/* ---------- LIFE TAP ---------- */

cards.forEach(card=>{
  const isTop = card.classList.contains("top-card");

  card.addEventListener("click", e=>{
    if(e.target.classList.contains("pass-btn")) return;

    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left;
    let delta = (x < rect.width/2) ? -1 : 1;
    if(isTop) delta = -delta;

    const id = card.dataset.player;
    const el = document.getElementById("life-"+id);
    el.textContent = Math.max(0, parseInt(el.textContent)+delta);
  });

  card.querySelector(".pass-btn").addEventListener("click", e=>{
    e.stopPropagation();
    nextPlayer();
  });
});

/* ---------- INIT ---------- */

if(cards.length){
  setActive(cards[0].dataset.player);
  updateTurnPill();
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
