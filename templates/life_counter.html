<!doctype html>
<html lang="en" data-bs-theme="dark">
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="apple-mobile-web-app-capable" content="yes">
      <meta name="mobile-web-app-capable" content="yes">
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
      <title>Commander Tracker</title>
      <link href="/static/bootstrap.min.css" rel="stylesheet">
      <style>
         :root {
         --darkest: #10121a;
         --darker: #171a26;
         --blue: #1e3a5f;
         --red: #A63232;
         --green: #3a6b54;
         --purple: #5A3A6B;
         --orange: #FF6B35;
         --yellow: #F2C94C;
         }
         html, body {
         height:100%;
         margin:0;
         overflow:hidden;
         background:#10121a;
         overscroll-behavior:none;
         touch-action:manipulation;
         font-family:Arial,sans-serif;
         }
         .life-wrapper {
         position:fixed;
         inset:0;
         }
         @media (orientation:portrait){
         .life-wrapper{
         width:100vh;
         height:100vw;
         top:50%;
         left:50%;
         transform:translate(-50%,-50%) rotate(90deg);
         }
         }
         .life-grid{
         position:absolute;
         inset:0;
         display:grid;
         }
         .life-card{
         position:relative;
         overflow:hidden;
         background:#000;
         }
         .life-card::before{
         content:"";
         position:absolute;
         inset:0;
         background-image:var(--bg-layer);
         background-size:cover;
         background-position:center;
         transform:var(--bg-rotate);
         }
         .card-inner{
         position:relative;
         z-index:1;
         }
         .life-display{
         font-size:18vh;
         font-weight:900;
         color:white;
         text-shadow:0 0 10px rgba(0,0,0,.9),0 0 30px rgba(0,0,0,.8);
         }
         /* Active turn highlight */
         .life-card.active-turn{
         outline:4px solid rgba(255,255,255,0.4);
         box-shadow:0 0 30px rgba(255,255,255,0.15) inset;
         }
         /* Pass button */
         .pass-btn{
         position:absolute;
         bottom:20px;
         right:20px;
         z-index:5;
         }
         .center-menu-btn{
         z-index:50;
         }
         /* Grid layouts */
         .players-2{grid-template-rows:1fr 1fr;}
         .players-3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;}
         .players-4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;}
         .players-5{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;}
         .players-6{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;}
         .pos-1{grid-area:p1;}
         .pos-2{grid-area:p2;}
         .pos-3{grid-area:p3;}
         .pos-4{grid-area:p4;}
         .pos-5{grid-area:p5;}
         .pos-6{grid-area:p6;}
      </style>
   </head>
   <body>
      <div class="life-wrapper">
         {% set n = participants|length %}
         <div class="life-grid players-{{ n }}">
            {% for p in participants %}
            {% set is_top =
            (n == 2 and loop.index0 == 0) or
            (n == 3 and loop.index0 < 2) or
            (n == 4 and loop.index0 < 2) or
            (n == 5 and loop.index0 < 3) or
            (n == 6 and loop.index0 < 3)
            %}
            <div
               class="life-card pos-{{ loop.index }}"
               data-player-index="{{ p.player_id }}"
               style="
               {% if p.commander_art %}
               --bg-layer:
               linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.85)),
               url('{{ p.commander_art }}');
               {% else %}
               --bg-layer:
               linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.85)),
               linear-gradient(135deg,var({{ p.color }}),#000);
               {% endif %}
               {% if is_top %}
               --bg-rotate:rotate(180deg);
               {% else %}
               --bg-rotate:none;
               {% endif %}
               "
               >
               <div class="card-inner h-100 w-100" style="{% if is_top %}transform:rotate(180deg);{% endif %}">
                  <small class="position-absolute bottom-0 start-50 translate-middle-x p-3 text-white fw-bold">
                  {{ p.player_name }}
                  </small>
                  <div class="position-absolute top-50 start-50 translate-middle life-display"
                     id="life-{{ p.player_id }}">40</div>
                  <div class="position-absolute top-0 start-0 p-3 d-flex gap-2 align-items-center">
                     <span class="badge bg-dark border" id="turn-badge-{{ p.player_id }}" style="display:none;">TURN</span>
                     <span class="badge bg-dark border" id="turn-dmg-{{ p.player_id }}">Turn dmg: 0</span>
                  </div>
                  <button type="button"
                     class="btn btn-sm btn-light pass-btn"
                     id="pass-{{ p.player_id }}"
                     style="display:none;">
                  Pass Turn →
                  </button>
               </div>
            </div>
            {% endfor %}
         </div>
         <!-- Center menu -->
         <button
            class="center-menu-btn position-absolute top-50 start-50 translate-middle btn btn-light rounded-circle p-3 shadow-lg"
            style="width:80px;height:80px;"
            data-bs-toggle="modal"
            data-bs-target="#menuModal">
         <img src="/static/hamburger.svg" width="40">
         </button>
      </div>
      <!-- Modal -->
      <div class="modal fade" id="menuModal">
         <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-light">
               <div class="modal-body text-center p-4">
                  <form method="post" action="/end_game">
                     <select name="winner" class="form-select mb-3" required>
                        <option value="" disabled selected>Select Winner</option>
                        {% for p in participants %}
                        <option value="{{ p.player_id }}">{{ p.player_name }}</option>
                        {% endfor %}
                     </select>
                     <button type="submit" class="btn btn-success w-100 mb-3">End Game & Record</button>
                  </form>
                  <form method="post" action="/cancel_game"
                     onsubmit="return confirm('Quit without saving?')">
                     <button type="submit" class="btn btn-outline-danger w-100">
                     Quit without Saving
                     </button>
                  </form>
               </div>
            </div>
         </div>
      </div>
      <script>
         let activePlayerId = {{ session.get("active_player_id") or "null" }};
         let turnDamage = {};
         
         function initTurn(){
         document.querySelectorAll(".life-card").forEach(card=>{
         const pid = card.dataset.playerIndex;
         turnDamage[pid]=0;
         });
         if(!activePlayerId){
         activePlayerId=document.querySelector(".life-card")?.dataset.playerIndex;
         }
         setActiveTurn(activePlayerId);
         }
         
         function setActiveTurn(pid){
         activePlayerId=String(pid);
         
         document.querySelectorAll(".life-card").forEach(card=>{
         const cid=card.dataset.playerIndex;
         const isActive=(cid===activePlayerId);
         
         card.classList.toggle("active-turn",isActive);
         
         document.getElementById("turn-badge-"+cid).style.display=isActive?"inline-block":"none";
         document.getElementById("pass-"+cid).style.display=isActive?"inline-block":"none";
         });
         }
         
         function nextPlayer(){
         const ids=Array.from(document.querySelectorAll(".life-card")).map(c=>c.dataset.playerIndex);
         let idx=ids.indexOf(activePlayerId);
         let next=ids[(idx+1)%ids.length];
         resetTurnDamage();
         setActiveTurn(next);
         }
         
         function resetTurnDamage(){
         for(const pid in turnDamage){
         turnDamage[pid]=0;
         document.getElementById("turn-dmg-"+pid).textContent="Turn dmg: 0";
         }
         }
         
         function adjustLife(player,amount){
         const el=document.getElementById("life-"+player);
         let before=parseInt(el.textContent,10);
         let after=before+amount;
         if(after<0)after=0;
         el.textContent=after;
         
         if(after<before){
         turnDamage[player]+=Math.abs(after-before);
         document.getElementById("turn-dmg-"+player).textContent=
         "Turn dmg: "+turnDamage[player];
         }
         
         checkWinner();
         }
         
         function checkWinner(){
         const alive=Array.from(document.querySelectorAll(".life-card"))
         .filter(card=>{
         const pid=card.dataset.playerIndex;
         return parseInt(document.getElementById("life-"+pid).textContent,10)>0;
         });
         if(alive.length===1){
         const winner=alive[0].dataset.playerIndex;
         const form=document.createElement("form");
         form.method="POST";
         form.action="/end_game";
         const input=document.createElement("input");
         input.type="hidden";
         input.name="winner";
         input.value=winner;
         form.appendChild(input);
         document.body.appendChild(form);
         form.submit();
         }
         }
         
         // Tap logic
         document.querySelectorAll(".life-card").forEach(card=>{
         const isTop=card.classList.contains("top-card");
         card.addEventListener("click",e=>{
         if(e.target.classList.contains("pass-btn"))return;
         const rect=card.getBoundingClientRect();
         const x=e.clientX-rect.left;
         let amount=(x<rect.width/2)?-1:1;
         if(isTop)amount=-amount;
         adjustLife(card.dataset.playerIndex,amount);
         });
         });
         
         document.querySelectorAll(".pass-btn").forEach(btn=>{
         btn.addEventListener("click",e=>{
         e.stopPropagation();
         nextPlayer();
         });
         });
         
         initTurn();
         
      </script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   </body>
</html>
