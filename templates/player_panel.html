<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>{{ this_player.player_name }} — Commandersohn</title>
  <link href="/static/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/player_panel.css" rel="stylesheet">
</head>
<body>

<div class="panel-life-area" id="lifeTapZone">
  <div class="panel-top-row">
    <div class="panel-player-name">{{ this_player.player_name }}</div>
    <div class="panel-turn-badge" id="turnBadge">Turn 1</div>
  </div>
  <div class="panel-life-zone-hints" aria-hidden="true">
    <span class="panel-life-hint panel-life-hint--minus">−</span>
    <span class="panel-life-hint panel-life-hint--plus">+</span>
  </div>
  <div class="panel-life-total" id="lifeTotal">40</div>
  <div class="panel-pending empty" id="pendingIndicator"></div>
</div>

<div class="panel-pass-row">
  <button class="panel-pass-btn" id="passTurnBtn" type="button" aria-label="Pass your turn">
    <span class="panel-pass-icon">↻</span> Pass Turn
  </button>
</div>

<div class="panel-bottom">
  <div class="panel-tab-bar" role="tablist">
    <button class="panel-tab-btn active" data-tab="flags" type="button" role="tab" aria-selected="true" aria-controls="tabFlags">
      <span class="tab-icon">⚑</span>
      <span class="tab-label">Flags</span>
      <span class="tab-badge" id="flagsBadge" hidden></span>
    </button>
    <button class="panel-tab-btn" data-tab="cmddmg" type="button" role="tab" aria-selected="false" aria-controls="tabCmddmg">
      <span class="tab-icon">⚔</span>
      <span class="tab-label">Cmd Dmg</span>
      <span class="tab-badge" id="cmdDmgBadge" hidden></span>
    </button>
    <button class="panel-tab-btn" data-tab="scores" type="button" role="tab" aria-selected="false" aria-controls="tabScores">
      <span class="tab-icon">📋</span>
      <span class="tab-label">Scores</span>
    </button>
  </div>

  <div class="panel-tab-content" id="tabFlags" role="tabpanel">
    <div class="panel-flags">
      <button class="panel-flag-btn" id="manaFuckedBtn" type="button">
        <span>💧</span> Mana Screwed
      </button>
      <button class="panel-flag-btn" id="misplayedBtn" type="button">
        <span>⚡</span> Misplayed
      </button>
    </div>
  </div>

  <div class="panel-tab-content hidden" id="tabCmddmg" role="tabpanel">
    <div class="panel-commander-damage" id="commanderDamageCard">
      <div class="commander-damage-list" id="commanderDamageList"></div>
    </div>
  </div>

  <div class="panel-tab-content hidden" id="tabScores" role="tabpanel">
    <div class="panel-scoreboard">
      <div class="scoreboard-list" id="scoreboardList"></div>
    </div>
  </div>
</div>

<script>
const TOKEN = {{ token|tojson }};
const MY_PLAYER_ID = {{ player_id|tojson }};
const MY_PID = String(MY_PLAYER_ID);
const PARTICIPANTS = {{ participants|tojson }};
const POLL_INTERVAL_MS = 2000;
const COMMIT_MS = 650;

let committedLife = Number({{ initial_state.life.get(this_player.player_id|string, 40)|tojson }}) || 40;
let pendingDelta = 0;
let pendingTimer = null;
let lastVersion = -1;
let flags = { mana_fucked: false, misplayed: false, salt_count: 0 };
let activePlayerId = null;
let commanderDamageBySource = {};

const OPPONENTS = (PARTICIPANTS || []).filter((p) => String(p.player_id) !== MY_PID);

// ---- Tab switching ----
function switchTab(tabName) {
  document.querySelectorAll(".panel-tab-btn").forEach((btn) => {
    const isActive = btn.dataset.tab === tabName;
    btn.classList.toggle("active", isActive);
    btn.setAttribute("aria-selected", String(isActive));
  });
  document.querySelectorAll(".panel-tab-content").forEach((panel) => {
    panel.classList.toggle("hidden", panel.id !== "tab" + capitalize(tabName));
  });
}

function capitalize(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);
}

document.querySelectorAll(".panel-tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => switchTab(btn.dataset.tab));
});

// ---- Life ----
function renderLife(){
  const display = Math.max(0, committedLife + pendingDelta);
  const el = document.getElementById("lifeTotal");
  el.textContent = String(display);
  el.classList.toggle("life-low", display <= 5);
  el.classList.toggle("life-mid", display > 5 && display <= 10);
}

function renderPending(){
  const el = document.getElementById("pendingIndicator");
  if(!pendingDelta){
    el.textContent = "";
    el.className = "panel-pending empty";
  } else {
    el.textContent = (pendingDelta > 0 ? "+" : "") + pendingDelta;
    el.className = "panel-pending" + (pendingDelta < 0 ? " loss" : "");
  }
}

function queueDelta(d){
  pendingDelta += d;
  renderPending();
  renderLife();
  clearTimeout(pendingTimer);
  pendingTimer = setTimeout(commitLife, COMMIT_MS);
}

function commitLife(){
  if(!pendingDelta) return;
  const delta = pendingDelta;
  committedLife = Math.max(0, committedLife + delta);
  pendingDelta = 0;
  renderPending();
  renderLife();
  pushUpdate({ life_delta: delta });
}

// ---- Flags ----
function renderFlags(){
  document.getElementById("manaFuckedBtn").classList.toggle("is-active", !!flags.mana_fucked);
  document.getElementById("misplayedBtn").classList.toggle("is-active", !!flags.misplayed);
  // Update badge on Flags tab
  const badge = document.getElementById("flagsBadge");
  const anyActive = !!flags.mana_fucked || !!flags.misplayed;
  badge.hidden = !anyActive;
}

// ---- Scoreboard ----
function renderScoreboard(state){
  const list = document.getElementById("scoreboardList");
  if(!list || !PARTICIPANTS) return;
  list.innerHTML = "";
  const apid = String(state.active_player_id || "");
  PARTICIPANTS.forEach((p) => {
    const pid = String(p.player_id);
    const life = (state.life || {})[pid] ?? "?";
    const row = document.createElement("div");
    row.className = "scoreboard-row" + (pid === apid ? " is-active" : "") + (pid === MY_PID ? " is-me" : "");
    row.innerHTML = `<span class="sb-name">${escapeHtml(p.player_name)}</span><span class="sb-life">${life}</span>`;
    list.appendChild(row);
  });
}

// ---- Commander damage ----
function renderCommanderDamage(){
  const list = document.getElementById("commanderDamageList");
  if(!list) return;
  list.innerHTML = "";

  OPPONENTS.forEach((opponent) => {
    const sourcePid = String(opponent.player_id);
    const current = Number(commanderDamageBySource[sourcePid]) || 0;
    const isDanger = current >= 21;
    const artUrl = opponent.commander_art || "";
    const artScale = opponent.commander_art_scale || "cover";

    const card = document.createElement("div");
    card.className = "cd-art-card" + (isDanger ? " is-danger" : "");
    if(artUrl){
      card.style.backgroundImage = `url(${JSON.stringify(artUrl)})`;
      card.style.backgroundSize = artScale;
      card.style.backgroundPosition = "center 15%";
      card.style.backgroundRepeat = "no-repeat";
    }
    card.innerHTML = `
      <div class="cd-art-overlay">
        <span class="cd-art-value" id="commanderDamage-${sourcePid}">${current}</span>
        <span class="cd-art-name">${escapeHtml(opponent.player_name)}</span>
        <div class="cd-art-controls">
          <button class="cd-btn" type="button" data-source-pid="${sourcePid}" data-delta="-1">−1</button>
          <button class="cd-btn cd-btn-plus" type="button" data-source-pid="${sourcePid}" data-delta="1">+1</button>
          <button class="cd-btn cd-btn-plus" type="button" data-source-pid="${sourcePid}" data-delta="5">+5</button>
        </div>
      </div>
    `;
    list.appendChild(card);
  });

  // Update badge on Cmd Dmg tab
  const total = Object.values(commanderDamageBySource).reduce((s, v) => s + (Number(v) || 0), 0);
  const badge = document.getElementById("cmdDmgBadge");
  if(total > 0){
    badge.hidden = false;
    badge.textContent = String(total);
  } else {
    badge.hidden = true;
  }
}

function queueCommanderDamage(sourcePid, delta){
  const current = Number(commanderDamageBySource[sourcePid]) || 0;
  const next = Math.max(0, Math.min(99, current + delta));
  if(next === current) return;
  commanderDamageBySource[sourcePid] = next;
  const valueEl = document.getElementById(`commanderDamage-${sourcePid}`);
  if(valueEl) valueEl.textContent = String(next);
  // Re-render row danger state
  renderCommanderDamage();
  pushUpdate({ card_state: { commander_damage: { [sourcePid]: next } } });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function applyRemoteState(state){
  if(typeof state.version !== "number" || state.version <= lastVersion) return;
  lastVersion = state.version;

  // Only update own life if no pending change in flight
  if(!pendingDelta){
    const remoteLife = (state.life || {})[MY_PID];
    if(typeof remoteLife === "number"){
      committedLife = remoteLife;
      renderLife();
    }
  }

  // Flags
  const remoteFlags = (state.flags || {})[MY_PID];
  if(remoteFlags){
    flags.mana_fucked = !!remoteFlags.mana_fucked;
    flags.misplayed = !!remoteFlags.misplayed;
    flags.salt_count = Number(remoteFlags.salt_count) || 0;
    renderFlags();
  }

  activePlayerId = state.active_player_id != null ? String(state.active_player_id) : null;
  renderPassTurnBtn();

  const remoteCommanderDamage = (((state.card_state || {})[MY_PID] || {}).commander_damage || {});
  const nextCommanderDamageBySource = {};
  OPPONENTS.forEach((opponent) => {
    const sourcePid = String(opponent.player_id);
    const remoteValue = remoteCommanderDamage[sourcePid];
    nextCommanderDamageBySource[sourcePid] = (typeof remoteValue === "number" && remoteValue >= 0)
      ? Math.min(99, remoteValue)
      : 0;
  });
  commanderDamageBySource = nextCommanderDamageBySource;

  renderScoreboard(state);
  renderCommanderDamage();

  const turnBadge = document.getElementById("turnBadge");
  if(turnBadge) turnBadge.textContent = `Turn ${state.turn || 1}`;
}

// ---- Pass Turn ----
function renderPassTurnBtn(){
  const btn = document.getElementById("passTurnBtn");
  if(!btn) return;
  const isMyTurn = activePlayerId === MY_PID;
  btn.classList.toggle("is-my-turn", isMyTurn);
  btn.disabled = !isMyTurn;
}

async function pushUpdate(patch){
  const body = Object.assign({ player_id: MY_PLAYER_ID }, patch);
  try {
    const resp = await fetch(`/api/game/${TOKEN}/state`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if(resp.ok){
      const data = await resp.json();
      applyRemoteState(data);
    }
  } catch(e){}
}

async function poll(){
  try {
    const resp = await fetch(`/api/game/${TOKEN}/state`);
    if(resp.status === 404){
      const turnBadge = document.getElementById("turnBadge");
      if(turnBadge) turnBadge.textContent = "Game ended";
      clearInterval(pollInterval);
      return;
    }
    if(resp.ok){
      const data = await resp.json();
      applyRemoteState(data);
    }
  } catch(e){}
}

// Tap zone: left half = −1, right half = +1
document.getElementById("lifeTapZone").addEventListener("pointerdown", (e) => {
  e.preventDefault();
  const rect = e.currentTarget.getBoundingClientRect();
  const delta = e.clientX < rect.left + rect.width / 2 ? -1 : 1;
  queueDelta(delta);
});

document.getElementById("manaFuckedBtn").addEventListener("click", () => {
  flags.mana_fucked = !flags.mana_fucked;
  renderFlags();
  pushUpdate({ flags: { mana_fucked: flags.mana_fucked, misplayed: flags.misplayed, salt_count: flags.salt_count } });
});

document.getElementById("misplayedBtn").addEventListener("click", () => {
  flags.misplayed = !flags.misplayed;
  renderFlags();
  pushUpdate({ flags: { mana_fucked: flags.mana_fucked, misplayed: flags.misplayed, salt_count: flags.salt_count } });
});

document.getElementById("passTurnBtn").addEventListener("click", () => {
  if(activePlayerId !== MY_PID) return;
  pushUpdate({ pass_turn: true });
});

document.getElementById("commanderDamageList").addEventListener("click", (event) => {
  const btn = event.target.closest("button.cd-btn");
  if(!btn) return;
  const sourcePid = btn.dataset.sourcePid;
  const delta = Number(btn.dataset.delta || 0);
  if(!sourcePid || !Number.isFinite(delta) || !delta) return;
  queueCommanderDamage(sourcePid, delta);
});

// Init from server state
const initState = {{ initial_state|tojson }};
if(initState && Object.keys(initState).length){
  applyRemoteState(initState);
} else {
  renderLife();
  renderScoreboard({});
  renderCommanderDamage();
  renderPassTurnBtn();
}

const pollInterval = setInterval(poll, POLL_INTERVAL_MS);
</script>
</body>
</html>
