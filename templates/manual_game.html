{% extends "base.html" %}
{% block content %}
<h1>Record New Game</h1>
<form method="post" action="/manual_record_game">
    <input type="hidden" name="winner" id="winner_hidden">
    <div class="row">
        {% for i in range(1,5) %}
        <div class="col-md-6 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5>Player {{ i }}</h5>
                    <select id="player{{ i }}" name="player{{ i }}" class="form-select mb-2">
                        <option value="">- None -</option>
                        {% for p in players %}
                            <option value="{{ p.id }}">{{ p.name }}</option>
                        {% endfor %}
                    </select>
                    <select id="deck{{ i }}" class="form-select mb-2" disabled>
                        <option>Select player first</option>
                    </select>
                    <div class="form-check">
                        <input type="radio" name="winner" id="winner{{ i }}" class="form-check-input" disabled>
                        <label class="form-check-label">Winner</label>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    <button type="submit" class="btn btn-success btn-lg">Save Game</button>
</form>

<script>
    const decksData = {{ decks_json | safe }};
    for (let i = 1; i <= 4; i++) {
        const playerSel = document.getElementById('player' + i);
        const deckSel = document.getElementById('deck' + i);
        const winnerRadio = document.getElementById('winner' + i);

        playerSel.addEventListener('change', function() {
            const pid = this.value;
            deckSel.innerHTML = '<option value="">Select deck</option>';
            deckSel.disabled = true;
            winnerRadio.disabled = true;
            winnerRadio.checked = false;

            if (pid && decksData[pid]) {
                decksData[pid].forEach(d => {
                    const opt = new Option(d.name, d.id);
                    deckSel.add(opt);
                });
                deckSel.disabled = false;
                winnerRadio.disabled = false;
                winnerRadio.value = pid;
            }
        });
    }
</script>
{% endblock %}
