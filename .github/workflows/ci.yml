name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --requirement requirements.lock
      - run: python -m py_compile app.py deck_import.py
      - run: python -m unittest discover -s tests
        env:
          FLASK_SECRET_KEY: ci-only-secret
          COMMANDER_ALLOW_DESTRUCTIVE: "1"
      - run: docker build --tag commander-tracker-ci .
